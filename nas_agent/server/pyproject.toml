[project]
name = "nas-mcp"
version = "0.1.0"
description = "MCP server that plans, submits and verifies large omics dataset downloads onto a home NAS via aria2"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.2",
  "httpx>=0.27",
  "pyyaml>=6",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
synapse = ["synapseclient>=4"]
inspect = ["h5py>=3.8", "pyarrow>=14"]
test = ["pytest>=8"]

[project.scripts]
nas-mcp = "nas_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nas_mcp = ["metadata/*.json", "metadata/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real public APIs (network)", "e2e: needs a local aria2c binary"]
